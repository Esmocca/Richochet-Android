version: "3.9"

services:
  ricochet-download:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ricochet-download
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "ricochet123"
    volumes:
      - ./data:/app/data
