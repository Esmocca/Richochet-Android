<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">
    <meta name="description" content="Ricochet Arcade HD - Retro Block Breaker Game">
    <title>Ricochet Arcade HD</title>
    <link rel="manifest" href="manifest.json">
    <style>
        @font-face {
            font-family: 'PixelFont';
            src: url('assets/fonts/pixel.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Virtual Buttons Overlay */
        #controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            display: none; /* shown only during gameplay */
            z-index: 10;
            pointer-events: none;
        }

        .ctrl-btn {
            position: absolute;
            bottom: 10px;
            width: 100px;
            height: 60px;
            background: rgba(0, 180, 255, 0.15);
            border: 2px solid rgba(0, 180, 255, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PixelFont', monospace;
            font-size: 28px;
            color: rgba(0, 220, 255, 0.7);
            pointer-events: auto;
            transition: background 0.1s;
        }

        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(0, 180, 255, 0.35);
            border-color: rgba(0, 220, 255, 0.8);
            color: rgba(0, 255, 255, 1.0);
        }

        #btnLeft {
            left: 15px;
        }

        #btnRight {
            right: 15px;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0c0e18;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            font-family: 'PixelFont', monospace;
            color: #0ff;
        }

        #loading h1 {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 10px;
        }

        #loading p {
            font-size: 14px;
            color: #0ff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>RICOCHET</h1>
        <p>LOADING...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div id="btnLeft" class="ctrl-btn">◀</div>
        <div id="btnRight" class="ctrl-btn">▶</div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
