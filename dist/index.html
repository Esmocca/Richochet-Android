<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">
    <meta name="description" content="Ricochet Arcade HD - Retro Block Breaker Game">
    <title>Ricochet Arcade HD</title>
    <link rel="manifest" href="manifest.json">
    <style>
        @font-face {
            font-family: 'PixelFont';
            src: url('assets/fonts/pixel.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Virtual Buttons Overlay */
        #controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            display: none; /* shown only during gameplay */
            z-index: 10;
            pointer-events: none;
        }

        .ctrl-btn {
            position: absolute;
            bottom: 10px;
            width: 100px;
            height: 60px;
            background: rgba(0, 180, 255, 0.15);
            border: 2px solid rgba(0, 180, 255, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PixelFont', monospace;
            font-size: 28px;
            color: rgba(0, 220, 255, 0.7);
            pointer-events: auto;
            transition: background 0.1s;
        }

        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(0, 180, 255, 0.35);
            border-color: rgba(0, 220, 255, 0.8);
            color: rgba(0, 255, 255, 1.0);
        }

        #btnLeft {
            left: 15px;
        }

        #btnRight {
            right: 15px;
        }

        /* ─── Loading Screen ─── */
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0c0e18;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            font-family: 'PixelFont', monospace;
            color: #0ff;
            transition: opacity 0.6s ease;
            overflow: hidden;
        }

        /* Scanline overlay */
        #loading::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 255, 0.02) 2px,
                rgba(0, 255, 255, 0.02) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Neon sweep */
        #loading::after {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            right: 0;
            height: 200%;
            background: linear-gradient(
                180deg,
                transparent 0%,
                transparent 45%,
                rgba(0, 255, 255, 0.08) 48%,
                rgba(0, 255, 255, 0.15) 50%,
                rgba(0, 255, 255, 0.08) 52%,
                transparent 55%,
                transparent 100%
            );
            animation: neonSweep 2.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes neonSweep {
            0% { transform: translateY(-20%); }
            100% { transform: translateY(70%); }
        }

        .loading-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #loading .logo-text {
            font-size: 36px;
            color: #ffd700;
            letter-spacing: 8px;
            margin-bottom: 4px;
            text-shadow:
                0 0 10px rgba(255, 215, 0, 0.6),
                0 0 20px rgba(255, 215, 0, 0.3),
                0 0 40px rgba(255, 215, 0, 0.1),
                2px 2px 0 rgba(0, 100, 255, 0.8);
            animation: glitchTitle 4s ease-in-out infinite;
        }

        @keyframes glitchTitle {
            0%, 95%, 100% { transform: translate(0, 0); opacity: 1; }
            96% { transform: translate(-3px, 1px); opacity: 0.9; }
            97% { transform: translate(2px, -1px); opacity: 1; }
            98% { transform: translate(-1px, 0); opacity: 0.95; }
        }

        .logo-subtitle {
            font-size: 10px;
            color: rgba(0, 220, 255, 0.8);
            letter-spacing: 12px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        #loadingMessages {
            font-size: 11px;
            color: #0ff;
            margin-bottom: 16px;
            min-height: 16px;
            animation: pulse 1.2s infinite;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }

        .progress-container {
            width: 220px;
            height: 8px;
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d2ff 0%, #00ff80 40%, #3a7bd5 100%);
            box-shadow:
                0 0 8px rgba(0, 210, 255, 0.8),
                0 0 15px rgba(0, 210, 255, 0.4);
            transition: width 0.2s ease;
            position: relative;
        }

        /* Shimmer on progress bar */
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: -50%; right: -50%; bottom: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 100%
            );
            animation: shimmer 1.5s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .loading-footer {
            font-size: 9px;
            color: rgba(80, 120, 160, 0.6);
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-content">
            <div class="logo-text">RICOCHET</div>
            <div class="logo-subtitle">ARCADE HD</div>
            <div id="loadingMessages">INITIALIZING QUANTUM CORE...</div>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="loading-footer">ESMOOCCA GAMES</div>
        </div>
    </div>
    <script>
        (function() {
            var bar = document.getElementById('progressBar');
            var msg = document.getElementById('loadingMessages');
            var p = 0;
            var msgs = [
                'INITIALIZING QUANTUM CORE...',
                'LOADING BRICK MATRICES...',
                'CALIBRATING PADDLE SYSTEMS...',
                'SYNCING PARTICLE ENGINE...',
                'ESTABLISHING NEURAL LINK...',
                'READY TO LAUNCH!'
            ];
            var timer = setInterval(function() {
                p += Math.random() * 18 + 5;
                if (p >= 100) {
                    p = 100;
                    clearInterval(timer);
                    setTimeout(function() {
                        var el = document.getElementById('loading');
                        if (el) el.style.opacity = '0';
                        setTimeout(function() { if (el) el.style.display = 'none'; }, 600);
                    }, 300);
                }
                if (bar) bar.style.width = p + '%';
                if (msg) {
                    var idx = Math.min(Math.floor(p / 100 * msgs.length), msgs.length - 1);
                    msg.textContent = msgs[idx];
                }
            }, 80);
        })();
    </script>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div id="btnLeft" class="ctrl-btn">◀</div>
        <div id="btnRight" class="ctrl-btn">▶</div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
